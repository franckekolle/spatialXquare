<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demandes reçues | SpatialXquare</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#062d5b">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <section class="admin-login" data-admin-login>
        <div>
          <p class="section-kicker">Administration</p>
          <h1>Demandes SpatialXquare</h1>
          <p data-admin-intro>Connectez-vous pour consulter les formulaires reçus depuis le site.</p>
        </div>
        <div class="admin-auth-switch" role="group" aria-label="Mode d'accès admin">
          <button class="is-active" type="button" data-auth-mode="login">Connexion</button>
          <button type="button" data-auth-mode="signup">Créer le compte admin</button>
        </div>
        <form class="admin-form" data-auth-form>
          <label data-signup-only hidden>Nom
            <input name="name" type="text" autocomplete="name">
          </label>
          <label data-signup-only hidden>Code d’inscription admin
            <input name="signup_code" type="password" autocomplete="off">
          </label>
          <label>E-mail
            <input name="email" type="email" autocomplete="email" required>
          </label>
          <label>Mot de passe
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="button button-primary" type="submit" data-auth-submit>Se connecter</button>
          <p data-login-feedback aria-live="polite"></p>
        </form>
      </section>

      <section class="admin-dashboard" data-admin-dashboard hidden>
        <header class="admin-header">
          <div>
            <p class="section-kicker">Tableau de bord</p>
            <h1>Formulaires reçus</h1>
            <p data-admin-user></p>
          </div>
          <button class="button button-secondary" type="button" data-logout>Déconnexion</button>
        </header>

        <div class="admin-stats" data-admin-stats></div>
        <div class="admin-controls">
          <label>Recherche
            <input type="search" data-admin-search placeholder="Nom, email, message, référence">
          </label>
          <label>Statut
            <select data-admin-status-filter>
              <option value="">Tous les statuts</option>
            </select>
          </label>
          <label>Service
            <select data-admin-service-filter>
              <option value="">Tous les services</option>
            </select>
          </label>
          <label>Trier par
            <select data-admin-sort>
              <option value="created_at">Date</option>
              <option value="request_id">Référence</option>
              <option value="client">Client</option>
              <option value="service">Service</option>
              <option value="status">Statut</option>
            </select>
          </label>
          <label>Ordre
            <select data-admin-direction>
              <option value="desc">Récent d'abord</option>
              <option value="asc">Ancien d'abord</option>
            </select>
          </label>
        </div>
        <div class="admin-list" data-admin-list></div>
        <div class="admin-pagination" data-admin-pagination></div>

        <section class="admin-users" data-admin-users-section hidden>
          <header>
            <div>
              <p class="section-kicker">Administration</p>
              <h2>Administrateurs</h2>
            </div>
          </header>
          <form class="admin-user-form" data-admin-user-form>
            <label>Nom
              <input name="name" type="text" autocomplete="name">
            </label>
            <label>E-mail
              <input name="email" type="email" autocomplete="email" required>
            </label>
            <label>Mot de passe provisoire
              <input name="password" type="password" autocomplete="new-password" required>
            </label>
            <button class="button button-primary" type="submit">Ajouter un admin</button>
            <p data-admin-user-feedback aria-live="polite"></p>
          </form>
          <div data-admin-users-list></div>
        </section>
      </section>

      <section class="admin-detail-panel" data-detail-panel hidden>
        <div class="admin-detail-card">
          <header>
            <div>
              <p class="section-kicker">Détail</p>
              <h2 data-detail-title>Demande</h2>
            </div>
            <button type="button" class="admin-icon-button" data-detail-close aria-label="Fermer">×</button>
          </header>
          <div class="admin-detail-content" data-detail-content></div>
        </div>
      </section>

      <section class="admin-reply-panel" data-reply-panel hidden>
        <div class="admin-reply-card">
          <header>
            <div>
              <p class="section-kicker">Répondre</p>
              <h2 data-reply-title>Répondre à la demande</h2>
              <p data-reply-recipient></p>
            </div>
            <button type="button" class="admin-icon-button" data-reply-close aria-label="Fermer">×</button>
          </header>
          <form data-reply-form>
            <input name="request_id" type="hidden">
            <label>Message de réponse
              <textarea name="message" rows="7" required></textarea>
            </label>
            <button class="button button-primary" type="submit">Envoyer la réponse</button>
            <p data-reply-feedback aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="/admin/admin.js" defer></script>
  </body>
</html>
